<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-title="nav_contact">NFCWORK</title>
  <meta name="description" content="NFCWORK — Solutions NFC pour votre business au Maroc : cartes NFC, plaques Google Reviews, menus digitaux, plaques Wi-Fi, caissons LED.">
  <meta name="theme-color" content="#05080f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>

  <main>
    <section class="wrap page-head">
      <h1 data-t="contactH"></h1>
      <p data-t="contactP"></p>
    </section>

    <section class="wrap">
      <div class="two">
        <div class="box">
          <form id="contactForm" novalidate>
            <label for="c-name"><span data-t="cName"></span><input id="c-name" autocomplete="name"><span class="err" id="e-c-name"></span></label>
            <label for="c-phone"><span data-t="cPhone"></span><input id="c-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06XXXXXXXX" dir="ltr"><span class="err" id="e-c-phone"></span></label>
            <label for="c-subject"><span data-t="cSubject"></span><select id="c-subject"></select></label>
            <label for="c-msg"><span data-t="cMsg"></span><textarea id="c-msg"></textarea><span class="err" id="e-c-msg"></span></label>
            <a class="btn wa block" id="c-send" href="#" target="_blank" rel="noopener" data-t="cSend"></a>
            <div class="copyrow"><span data-t="fallback"></span><code dir="ltr" class="phone-num"></code><button type="button" id="c-copy" data-t="copy"></button></div>
          </form>
        </div>
        <div class="box">
          <h2 data-t="directH"></h2>
          <div class="direct">
            <div><span data-t="waLbl"></span><a id="d-wa" href="#" target="_blank" rel="noopener" dir="ltr"><span id="d-wa-num"></span></a></div>
            <div><span data-t="igLbl"></span><a id="d-ig" href="#" target="_blank" rel="noopener" dir="ltr"><span id="d-ig-name"></span></a></div>
            <div><span data-t="telLbl"></span><a id="d-tel" href="#" dir="ltr"><span id="d-tel-num"></span></a></div>
            <div id="d-email-row"><span data-t="emailLbl"></span><a id="d-email" href="#" dir="ltr"></a></div>
            <div><span data-t="zoneLbl"></span><b data-t="zone"></b></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
