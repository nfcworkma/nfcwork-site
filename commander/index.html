<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commander à Kénitra · Ncommandiw</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E07B0A">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF6EC; --fg:#201A12; --muted:#6E6555; --line:#ECE3D4;
    --accent:#E07B0A; --accent-soft:#FBEAD0; --ok:#2E8B6A; --card:#fff;
    --shadow:0 6px 24px rgba(20,16,8,.10);
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15110B; --fg:#F3ECDF; --muted:#A99C86; --line:#352C20;
    --accent:#F2A20C; --accent-soft:#2A2113; --ok:#56C79A; --card:#201A12; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15110B; --fg:#F3ECDF; --muted:#A99C86; --line:#352C20;
    --accent:#F2A20C; --accent-soft:#2A2113; --ok:#56C79A; --card:#201A12; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
  #app{max-width:460px;margin:0 auto;min-height:100vh;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  .bar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
  .bar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;color:var(--accent)}
  .bar .loc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .pad{padding:16px}
  .search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;color:var(--muted);font-size:14px;margin-bottom:16px}
  .sec{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:4px 0 12px}
  .rcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
  .rcard .logo{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;
    font-size:26px;flex:0 0 auto;background-size:cover;background-position:center;overflow:hidden}
  .rcard .logo.img{background-color:var(--card)}
  .rcard .info{min-width:0;flex:1}
  .rcard .nm{font-weight:800;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .ty{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
  .rcard .meta .liv{color:var(--ok);font-weight:700}
  .rcard .chev{margin-left:auto;color:var(--muted);font-size:20px;align-self:center;flex:0 0 auto}
  .state,.empty{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
  .empty h2{color:var(--fg);margin:10px 0 4px;font-size:20px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);
    animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px calc(32px + env(safe-area-inset-bottom,0px))}
  footer b{color:var(--accent)}
  footer a{color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="app"><div class="state"><div><div class="spin"></div>Chargement des restaurants…</div></div></div>
<script src="/commander/commander.js"></script>
</body>
</html>
