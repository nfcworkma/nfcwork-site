<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caisse NFCWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040a1d">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icons/favicon-32.png">
<link rel="manifest" href="pos-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
/* Caisse web NFCWORK : utilisable sans lire (icônes, couleurs, photos, billets), FR / عربي.
   Les commandes du menu QR arrivent ici en direct avec la table ; le caissier envoie en cuisine, imprime et encaisse. */
:root{--bg:#040a1d;--bg2:#08122c;--card:#0d1a3a;--card2:#12234d;--line:#1c2d5a;--fg:#fff;--mut:#a7b6d9;--acc:#2f7bff;--acc2:#5cc8ff;
  --ok:#1faa59;--warn:#ff9f1c;--bad:#ff5d5d;--r:18px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,"Noto Kufi Arabic",system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 85% -10%,rgb(47 123 255/.18),transparent 70%),var(--bg);min-height:100vh;user-select:none}
input,textarea{user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgb(4 10 29/.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .nm{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;font-weight:800;font-size:18px;padding:6px 4px}
.top .nm .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp,.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;white-space:nowrap;min-height:44px}
.chip.on{border-color:var(--acc);background:rgb(47 123 255/.18)}
@media(max-width:620px){.chip .tx,.top .nm .tx{display:none}}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgb(31 170 89/.22)}
.dot.off{background:var(--bad);box-shadow:0 0 0 5px rgb(255 93 93/.25);animation:pul 1s infinite}
.av{width:58px;height:58px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:26px;color:#fff;flex:none}
.av.big{width:86px;height:86px;font-size:40px}.av.sm{width:30px;height:30px;font-size:15px}
main{padding:18px 16px 110px;max-width:1440px;margin:0 auto}
h1{font-size:32px;margin:6px 0 4px;letter-spacing:-.02em}h2{margin:0 0 12px;font-size:21px}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px}
.btn.p{background:var(--acc);border-color:var(--acc)}.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.w{background:var(--warn);border-color:var(--warn);color:#241500}
.btn.bad{background:transparent;border-color:rgb(255 93 93/.5);color:#ffb3b3}.btn.big{padding:14px 20px;font-size:18px;min-height:58px}.btn.huge{padding:18px 22px;font-size:22px;min-height:70px;border-radius:18px}
.btn:disabled{opacity:.4}.btn.sm{padding:8px 12px;font-size:14px;min-height:40px;border-radius:12px}
.btn.icon{width:52px;height:52px;padding:0;font-size:22px}.btn.back{margin-bottom:10px;padding:10px 16px}
.btn:active,.tile:active,.tb:active,.pr:active,.act:active{transform:scale(.97)}
/* couleurs des grandes zones */
.c0{--c:#5b6b95}.c1{--c:#2f7bff}.c2{--c:#ff9f1c}.c3{--c:#1faa59}.c4{--c:#5cc8ff}
/* accueil */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:20px}
.tile{position:relative;text-align:start;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),var(--card));border-radius:26px;padding:22px;min-height:190px;display:flex;flex-direction:column;gap:8px}
.tile .ic{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:42px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.tile b{font-size:26px}.tile small{color:var(--mut);font-size:17px}
.tile .bdg{position:absolute;top:16px;inset-inline-end:16px;background:var(--warn);color:#241500;font-weight:800;border-radius:999px;padding:6px 14px;font-size:20px}
.alert{animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{box-shadow:0 0 0 8px rgb(255 159 28/.28)}}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;min-width:170px;font-size:15px}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
/* tables */
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 4px;color:var(--mut);font-size:15px}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:16px;height:16px;border-radius:5px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:14px}
.tb{position:relative;border:2px solid var(--line);background:#16244a;border-radius:24px;padding:14px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tb .n{font-size:46px;font-weight:800;line-height:1}.tb .ic{font-size:24px}.tb small{color:var(--mut);font-size:15px}
.tb .t{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.tb.occ{border-color:var(--acc);background:linear-gradient(160deg,rgb(47 123 255/.4),var(--card))}
.tb.rdy{border-color:var(--ok);background:linear-gradient(160deg,rgb(31 170 89/.4),var(--card))}
.tb.new{border-color:var(--warn);background:linear-gradient(160deg,rgb(255 159 28/.45),var(--card));animation:pul 1.2s infinite}
/* une table */
.thead{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.tnum{width:78px;height:78px;border-radius:22px;background:var(--acc);display:grid;place-items:center;font-size:40px;font-weight:800}
.tbig{font-size:30px;font-variant-numeric:tabular-nums}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:6px 0 16px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 28%,var(--card));border-radius:22px;padding:16px 10px;min-height:120px;font-size:40px}
.act b{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* cartes de commande */
.oc{border:2px solid var(--line);background:var(--bg2);border-radius:20px;padding:14px}
.oc.nouvelle{border-color:var(--warn)}.oc.cuisine{border-color:var(--acc)}.oc.prete{border-color:var(--ok)}
.oc .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.nb{font-size:18px}.meta{color:var(--mut);font-size:14px;margin-bottom:6px;line-height:1.5}
.st{font-size:15px;font-weight:800;border-radius:999px;padding:6px 12px}
.st.nouvelle{background:var(--warn);color:#241500}.st.cuisine{background:var(--acc)}.st.prete{background:var(--ok)}.st.payee{background:#2b3a63}.st.annulee{background:#4a1f2a}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgb(255 255 255/.1);font-size:17px}
.ln b{font-variant-numeric:tabular-nums;white-space:nowrap}.ln .q{color:var(--acc2);font-size:19px}
.ln.tot2{border:0;font-weight:800;font-size:19px}
.note{background:rgb(255 159 28/.16);border:1px solid rgb(255 159 28/.45);color:#ffd9a3;border-radius:12px;padding:9px 12px;margin-top:8px;font-size:16px;font-weight:600}
.cli{font-size:15px;color:var(--mut);margin-top:8px;line-height:1.6}.cli a{color:var(--acc2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.sp2{flex:1}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.col{display:grid;gap:12px;align-content:start}
.col h3{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 30%,var(--card));border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
/* prise de commande */
.order{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.order{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.cart{position:sticky;top:84px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:2px solid var(--line);background:var(--bg2);border-radius:999px;padding:12px 18px;font-weight:700;font-size:16px}
.cats button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.pr{position:relative;border:2px solid var(--line);background:var(--bg2);border-radius:20px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pr.in{border-color:var(--warn)}
.pr b{font-size:16px;line-height:1.25}.pr span{color:var(--acc2);font-weight:800;font-size:17px}
.pr em{position:absolute;top:8px;inset-inline-end:8px;background:var(--warn);color:#241500;font-style:normal;font-weight:800;border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;font-size:18px}
.pim{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#1c3577,#0f1f47);display:grid;place-items:center}
.pim i{font-style:normal;font-size:40px;font-weight:800;color:rgb(255 255 255/.35)}.pim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgb(255 255 255/.1)}
.cl .pim{width:52px;flex:none;border-radius:12px}.cl .pim i{font-size:20px}
.cl .nn{flex:1;font-weight:700;font-size:16px;line-height:1.25}.cl .nn small{display:block;color:var(--mut);font-weight:500}
.q{display:inline-flex;align-items:center;gap:8px}.q button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:800;font-size:22px}.q b{font-size:20px;min-width:22px;text-align:center}
.bdg2{background:var(--warn);color:#241500;border-radius:999px;padding:2px 10px;font-size:16px}
.tot{display:flex;justify-content:space-between;font-size:26px;font-weight:800;margin:14px 0;font-variant-numeric:tabular-nums}
/* PIN */
.center{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:20px}
.pinbox{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;width:min(440px,100%);text-align:center}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.faces button{border:2px solid var(--line);background:var(--bg2);border-radius:22px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:18px}
.dots{display:flex;gap:16px;justify-content:center;margin:18px 0}.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc2);border-color:var(--acc2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:72px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);font-size:28px;font-weight:800}
.pad button:last-child{background:var(--ok);border-color:var(--ok)}
.err{color:#ffb3b3;min-height:24px;margin:10px 0 0;font-size:16px;font-weight:700}
.field{display:grid;gap:6px;text-align:start;margin:10px 0;font-size:15px;color:var(--mut)}.field input,.field select{background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:14px;font-size:18px}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:16px}.chk input{width:22px;height:22px}
/* encaisser */
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.65);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;width:min(480px,100%);max-height:94vh;overflow:auto}
.bigtot{font-size:46px;font-weight:800;text-align:center;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pm button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--bg2);font-size:34px}
.pm button b{font-size:18px}.pm button[aria-pressed=true]{border-color:var(--ok);background:rgb(31 170 89/.22)}
.bills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bills button{height:64px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--b),color-mix(in srgb,var(--b) 60%,#000));font-size:24px;font-weight:800;box-shadow:inset 0 0 0 3px rgb(255 255 255/.25)}
.bills .ex{grid-column:1/-1;height:52px;background:var(--card2);border:1px solid var(--line);font-size:17px;box-shadow:none}
.recu{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;font-size:22px;font-weight:800}
.rendu{border-radius:16px;padding:14px;text-align:center;font-size:22px}.rendu b{font-size:30px}
.rendu.ok{background:rgb(31 170 89/.2);border:2px solid var(--ok)}.rendu.ko{background:rgb(255 93 93/.15);border:2px solid var(--bad)}
/* bandeaux */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:#0b0f18;border:1px solid var(--line);color:#fff;padding:14px 20px;border-radius:16px;font-weight:700;font-size:17px;box-shadow:0 14px 40px rgb(0 0 0/.5)}
.toast.ok{background:var(--ok);border-color:var(--ok)}
.alarm{position:fixed;bottom:20px;inset-inline-end:20px;z-index:40;background:var(--warn);color:#241500;font-weight:800;padding:14px 18px;border-radius:20px;border:0;box-shadow:0 14px 40px rgb(0 0 0/.5);display:flex;gap:12px;align-items:center;font-size:19px;animation:pul 1.2s infinite}
.alarm .big{font-size:30px}.alarm .go{background:#241500;color:var(--warn);border-radius:12px;padding:8px 12px}
.panne{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--bad);color:#fff;font-weight:800;font-size:17px;padding:14px 16px;text-align:center;box-shadow:0 10px 30px rgb(0 0 0/.4)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;border:2px dashed var(--line);border-radius:18px;font-size:17px}
@media print{body *{visibility:hidden}}
</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main id="app"><div class="center"><p class="mut">Chargement de la caisse…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="pos.js?v=2"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../service-worker.js",{scope:"/"}).catch(()=>{});</script>
</body>
</html>
