<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caisse NFCWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040a1d">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icons/favicon-32.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Caisse web NFCWORK : s'ouvre sur l'ordinateur ou la tablette de la caisse.
   Les commandes du menu QR arrivent ici en direct, avec la table ; le caissier lance en cuisine, imprime et encaisse. */
:root{--bg:#040a1d;--bg2:#08122c;--card:#0d1a3a;--card2:#12234d;--line:#1c2d5a;--fg:#fff;--mut:#a7b6d9;--acc:#2f7bff;--acc2:#5cc8ff;
  --ok:#1faa59;--warn:#ff9f1c;--bad:#ff5d5d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 85% -10%,rgb(47 123 255/.18),transparent 70%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgb(4 10 29/.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .nm{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;min-width:0}
.top .nm img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff}
.top .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{border-color:var(--acc);background:rgb(47 123 255/.18)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgb(31 170 89/.2)}
.dot.off{background:var(--bad);box-shadow:0 0 0 4px rgb(255 93 93/.2)}
main{padding:18px 16px 40px;max-width:1400px;margin:0 auto}
h1{font-size:30px;margin:6px 0 4px;letter-spacing:-.02em}h2{margin:0 0 12px;font-size:20px}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.p{background:var(--acc);border-color:var(--acc)}.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.w{background:var(--warn);border-color:var(--warn);color:#241500}
.btn.bad{background:transparent;border-color:rgb(255 93 93/.5);color:#ffb3b3}.btn.big{padding:16px 22px;font-size:17px}.btn:disabled{opacity:.45}
.btn.sm{padding:8px 11px;font-size:13.5px;border-radius:11px}
/* accueil */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));border-radius:22px;padding:20px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:rgb(47 123 255/.2)}
.tile b{font-size:20px}.tile small{color:var(--mut);font-size:14px}
.tile .bdg{position:absolute;top:14px;right:14px;background:var(--warn);color:#241500;font-weight:800;border-radius:999px;padding:4px 10px;font-size:14px}
.tile.alert{border-color:var(--warn);animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px rgb(255 159 28/.25)}}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:150px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
/* tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.tb{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px;min-height:130px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.tb .n{font-size:30px;font-weight:800;line-height:1}.tb small{color:var(--mut);font-size:13px}
.tb .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgb(255 255 255/.06);font-size:20px}
.tb.occ{border-color:var(--acc);background:linear-gradient(160deg,rgb(47 123 255/.25),var(--card))}
.tb.new{border-color:var(--warn);background:linear-gradient(160deg,rgb(255 159 28/.25),var(--card));animation:pul 1.2s infinite}
.tb .t{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
/* vue commande */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.oc{border:1px solid var(--line);background:var(--bg2);border-radius:16px;padding:12px;margin-bottom:10px}
.oc.nouvelle{border-color:var(--warn)}.oc.cuisine{border-color:var(--acc)}.oc.prete{border-color:var(--ok)}
.oc .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.st{font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 9px;letter-spacing:.02em}
.st.nouvelle{background:var(--warn);color:#241500}.st.cuisine{background:var(--acc)}.st.prete{background:var(--ok)}.st.payee{background:#2b3a63}.st.annulee{background:#4a1f2a}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgb(255 255 255/.08);font-size:15px}
.ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:rgb(255 159 28/.14);border:1px solid rgb(255 159 28/.4);color:#ffd9a3;border-radius:10px;padding:7px 10px;margin-top:8px;font-size:14px}
.cli{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.5}.cli a{color:var(--acc2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:12px 0;font-variant-numeric:tabular-nums}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.cats button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px;max-height:52vh;overflow:auto}
.pr{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.pr b{font-size:14.5px;line-height:1.25}.pr span{color:var(--acc2);font-weight:700;font-size:14px}
.pr:active{transform:scale(.97)}
.cart .ln button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-weight:800}
.cart .q{display:inline-flex;align-items:center;gap:8px}
/* liste commandes en ligne */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between}
/* PIN */
.center{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:20px}
.pinbox{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;width:min(420px,100%);text-align:center}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc2);border-color:var(--acc2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);font-size:24px;font-weight:700}
.err{color:#ffb3b3;min-height:22px;margin:8px 0 0;font-size:14px}
.field{display:grid;gap:6px;text-align:left;margin:10px 0;font-size:14px;color:var(--mut)}.field input,.field select{background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font-size:16px}
/* modale */
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;width:min(460px,100%);max-height:92vh;overflow:auto}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.pay button{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
.pay button[aria-pressed=true]{border-color:var(--ok);background:rgb(31 170 89/.2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:#0b0f18;border:1px solid var(--line);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;box-shadow:0 14px 40px rgb(0 0 0/.5)}
.alarm{position:fixed;bottom:20px;right:20px;cursor:pointer;z-index:40;background:var(--warn);color:#241500;font-weight:800;padding:14px 20px;border-radius:16px;box-shadow:0 14px 40px rgb(0 0 0/.5);display:flex;gap:12px;align-items:center;font-size:17px}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.back{margin-bottom:8px}
@media print{body *{visibility:hidden}}
</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main id="app"><div class="center"><p class="mut">Chargement de la caisse…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="pos.js?v=1"></script>
</body>
</html>
