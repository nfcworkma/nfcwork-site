<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plateforme · nfcwork.ma</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040a1d">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="outil.css">
<style>
  .pf-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
  .pf-head h2{margin:0;font-size:20px}
  .pf-count{font-size:13px;color:var(--muted,#8a93a6)}
  .pf-list{display:grid;gap:10px}
  .pf-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line,#2a2f3b);border-radius:14px;background:var(--surface,#171a22)}
  .pf-row.off{opacity:.55}
  .pf-logo{width:46px;height:46px;border-radius:12px;background:var(--sunk,#1f232d);background-size:cover;background-position:center;display:grid;place-items:center;font-size:22px;flex:0 0 auto;overflow:hidden}
  .pf-info{min-width:0;flex:1}
  .pf-nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-meta{font-size:12px;color:var(--muted,#8a93a6);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .pf-meta .on{color:#1faa59;font-weight:600}
  .pf-meta .no{color:#d64545;font-weight:600}
  .pf-ord{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
  .pf-ord button{width:30px;height:24px;border:1px solid var(--line,#2a2f3b);background:var(--sunk,#1f232d);color:inherit;border-radius:7px;cursor:pointer;font-size:13px;line-height:1}
  .pf-ord button:disabled{opacity:.3;cursor:default}
  .sw{position:relative;width:46px;height:27px;flex:0 0 auto;border:0;border-radius:999px;background:var(--line,#39405166);cursor:pointer;transition:background .15s}
  .sw[aria-pressed=true]{background:#1faa59}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s}
  .sw[aria-pressed=true]::after{left:22px}
  .pf-acts{display:flex;gap:6px;flex:0 0 auto}
  .pf-acts a{padding:7px 9px;border-radius:9px;border:1px solid var(--line,#2a2f3b);text-decoration:none;color:inherit;font-size:12px;font-weight:600}
  .pf-foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  @media(max-width:520px){.pf-acts a .lbl{display:none}}
  .pf-tabs{display:flex;gap:6px;background:var(--sunk,#1f232d);padding:5px;border-radius:12px;margin:4px 0 14px;position:sticky;top:8px;z-index:5;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .pf-tabs::-webkit-scrollbar{display:none}
  .pf-tabs button{flex:0 0 auto;white-space:nowrap;border:0;background:transparent;color:var(--muted,#8a93a6);font-weight:700;font-size:13px;padding:10px 12px;border-radius:9px;cursor:pointer}
  .pf-tabs button[aria-selected=true]{background:var(--surface,#171a22);color:var(--fg,#fff);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .pf-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pf-add input{flex:1;min-width:120px;padding:11px;border:1px solid var(--line,#2a2f3b);border-radius:11px;background:var(--surface,#171a22);color:inherit;font:inherit}
  .pf-add button{flex:0 0 auto}
  .pf-del{border:1px solid var(--line,#2a2f3b);background:var(--sunk,#1f232d);color:inherit;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:13px}
  .pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .pf-stats .st{background:var(--surface,#171a22);border:1px solid var(--line,#2a2f3b);border-radius:12px;padding:12px 8px;text-align:center}
  .pf-stats .st b{display:block;font-size:18px}
  .pf-stats .st span{font-size:11px;color:var(--muted,#8a93a6)}
  .spin2{width:26px;height:26px;border-radius:50%;border:3px solid var(--line,#2a2f3b);border-top-color:var(--accent,#d62828);animation:sp 1s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pf-sel{padding:11px;border:1px solid var(--line,#2a2f3b);border-radius:11px;background:var(--surface,#171a22);color:inherit;font:inherit}
  .sc-card{border:1px solid var(--line,#2a2f3b);border-radius:14px;background:var(--surface,#171a22);margin-bottom:10px;overflow:hidden}
  .sc-card.off{opacity:.6}
  .sc-top{display:flex;align-items:center;gap:12px;padding:12px}
  .sc-body{padding:0 12px 14px;border-top:1px solid var(--line,#2a2f3b);display:flex;flex-direction:column;gap:8px}
  .sc-lbl{font-size:12px;font-weight:700;color:var(--muted,#8a93a6);margin-top:12px}
  .sc-mut{font-size:13px;color:var(--muted,#8a93a6);margin:4px 0}
  .sc-restos{display:flex;flex-direction:column;gap:6px}
  .sc-chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
  .sc-chk input{width:18px;height:18px;flex:0 0 auto}
  .sc-lvadd input{min-width:90px}
  .vcard .vhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .vcard .vhead b{font-size:16px}
  .vbadge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk,#1f232d);color:var(--muted,#8a93a6)}
  .vgrid{display:grid;gap:6px;margin-bottom:12px}
  .vl{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid var(--line,#2a2f3b);padding-bottom:5px}
  .vl span{color:var(--muted,#8a93a6)}
  .vl b{text-align:right;word-break:break-word}
  .vdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:14px}
  .vdoc{display:block;text-decoration:none;color:var(--muted,#8a93a6)}
  .vdoc img{width:100%;height:82px;object-fit:cover;border-radius:10px;border:1px solid var(--line,#2a2f3b);background:var(--sunk,#1f232d)}
  .vdoc span{display:block;font-size:11px;text-align:center;margin-top:3px;text-transform:capitalize}
  .vacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .vacts .btn{flex:1;min-width:120px}
  .vseg{display:flex;gap:6px;background:var(--sunk,#1f232d);padding:5px;border-radius:12px;margin-bottom:14px}
  .vseg button{flex:1;border:0;background:transparent;color:var(--muted,#8a93a6);font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:9px;cursor:pointer}
  .vseg button.on{background:var(--surface,#171a22);color:var(--fg,#fff);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .vstate{font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:9px;flex:1;min-width:120px}
  .vstate.ok{background:rgba(31,170,89,.15);color:#1faa59}
  .vstate.no{background:rgba(214,69,69,.15);color:#e06666}
  /* tableau de bord */
  .dash-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted,#8a93a6);margin:6px 2px 10px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .kpi{background:var(--surface,#171a22);border:1px solid var(--line,#2a2f3b);border-radius:14px;padding:15px}
  .kpi .v{font-size:24px;font-weight:900;letter-spacing:-.02em}
  .kpi .k{font-size:12px;color:var(--muted,#8a93a6);font-weight:600;margin-top:4px}
  .kpi.big{grid-column:1/-1}
  .kpi.big .v{font-size:30px;color:var(--accent,#E07B0A)}
  .kpi.warn{border-color:#E07B0A}
  .kpi.warn .v{color:#F2A20C}
  .pf-swatch{width:34px;height:34px;border-radius:9px;border:1px solid var(--line,#2a2f3b);flex:0 0 auto}
  input[type=color]{cursor:pointer}
</style>
</head>

</body>
</html>
