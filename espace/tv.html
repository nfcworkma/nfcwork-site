<style>
/* Menus TV : un PDF (ou des photos) → un lien qui défile tout seul sur la TV */
.tvlist{display:grid;gap:10px}
.tvrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tvrow .mini{width:92px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none;background:#000;display:grid;place-items:center}
.tvrow .mini img{width:100%;height:100%;object-fit:contain}
.tvrow .tx{flex:1;min-width:0}
.tvrow .u{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pg{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.pg img{width:100%;height:100%;object-fit:contain;display:block}
.pg .no{position:absolute;top:6px;inset-inline-start:6px;background:rgb(0 0 0/.65);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px}
.pg .acts{position:absolute;bottom:6px;inset-inline-end:6px;display:flex;gap:4px}
.pg .acts button{border:0;border-radius:8px;background:rgb(0 0 0/.65);color:#fff;width:30px;height:30px;cursor:pointer;font-size:14px}
.pg .acts button:disabled{opacity:.35}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:12px}
.drop.busy{opacity:.6;pointer-events:none}
.linkbox{border-radius:16px;padding:16px;background:linear-gradient(120deg,#0b1a3a,#123a7a);border:1px solid var(--line);display:grid;gap:10px}
.linkbox code{display:block;font-size:17px;font-weight:700;color:#fff;word-break:break-all}
.linkbox .qr{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px}
.linkbox .qr svg{width:100%;height:100%;display:block}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
