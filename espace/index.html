<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace client · nfcwork.ma</title>
<meta name="theme-color" content="#05080f">
<link rel="icon" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>

/* Layout: mobile-first app shell, sticky header + bottom tab bar; content in one column, two on wide screens */
/* Thème = celui du site (assets/css/style.css) : sombre, bleu électrique NFCWORK */
:root{
  --bg:#05080f; --surface:#0b1220; --sunk:#111b2e; --fg:#e9effa; --muted:#93a3be; --line:#1d2b45;
  --accent:#1e90ff; --accent-2:#3fd0ff; --accent-fg:#FFFFFF; --accent-soft:color-mix(in srgb,#1e90ff 18%,#0b1220); --gold:#f2b53a;
  --ok:#25d366; --ok-soft:color-mix(in srgb,#25d366 14%,#0b1220); --warn:#f2b53a; --warn-soft:color-mix(in srgb,#f2b53a 14%,#0b1220); --bad:#ff6b6b; --bad-soft:color-mix(in srgb,#ff6b6b 14%,#0b1220);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --mono:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;flex:none;display:block}
.brand h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
main{max-width:960px;margin:0 auto;padding:18px 16px 110px}
h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0;line-height:1.2}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 22px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.lead .eyebrow,.kpi.lead b small{color:var(--accent-fg);opacity:.8}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{text-align:right;flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.sent{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.draft{background:var(--sunk);color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:4px}
.empty .btn{margin-top:12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;font-weight:500;position:relative}
.tab svg{width:22px;height:22px}
.tab .badge-n{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab[aria-current="page"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,4,9,.8);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.sheet{border-radius:18px;padding:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;color:var(--fg)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 34px;gap:6px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.line .desc{grid-column:1/-1}
.line input,.line select{background:var(--surface)}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;width:34px;height:38px;display:grid;place-items:center;border-radius:8px}
.iconbtn:hover{color:var(--bad);background:var(--bad-soft)}
.totals{display:grid;gap:4px;margin-left:auto;width:min(100%,280px)}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--fg)}
.check input{width:auto}
/* invoice paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;overflow:hidden}
.paper-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:14px}
.paper .tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.tap-arc{color:var(--accent-2)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.svc-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;background:var(--sunk)}
.svc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.svc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.svc .price{font-family:var(--mono);font-size:18px;font-weight:700}
.svc p{margin:0;color:var(--muted);font-size:14px}
.hero-pub{padding:10px 0 22px}
.hero-pub h2{font-size:30px}
.hero-pub p{color:var(--muted);max-width:56ch;margin:6px 0 0}
.notice{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.auth{max-width:420px;margin:7vh auto 40px;padding:0 16px}
.auth .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.auth h2{font-size:26px;margin-bottom:4px}
.auth .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.auth .btn.primary{width:100%;justify-content:center;padding:14px;font-size:16px}
.linkbtn{background:none;border:0;color:var(--accent-2);font-weight:600;cursor:pointer;padding:4px 0}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}
.who{font-size:12.5px;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* catalogue, panier, commandes */
.pill.new{background:var(--accent-soft);color:var(--accent-2)}
.btn.wa{background:var(--ok);border-color:var(--ok);color:#06210f;text-decoration:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;object-position:top;flex:none;background:var(--sunk)}
.img-preview{border:1px dashed var(--line);border-radius:12px;min-height:90px;display:grid;place-items:center;padding:8px;font-size:13px}
.img-preview img{display:block;width:140px;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:8px}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.cline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .main{flex:1;min-width:0}.cline .t{font-weight:600}.cline .s{font-size:13px;color:var(--muted)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -12px rgba(0,0,0,.6)}
.cartbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ocard.is-new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ocard-main{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.ocard-main .t{font-weight:600}.ocard-main .s{font-size:13px;color:var(--muted)}
.ocard-act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}
.onote{font-size:13px;color:var(--muted);font-style:italic;white-space:pre-wrap}
.ohist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.ohist li{display:flex;justify-content:space-between;gap:10px;padding-inline-start:14px;border-inline-start:2px solid var(--accent)}
.oprog{margin:8px 0 2px}
.oprog-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.oprog-bar i{height:6px;border-radius:99px;background:var(--sunk)}
.oprog-bar i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.oprog-lab{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.25}
.oprog-lab .cur{color:var(--accent-2);font-weight:600}
.oprog.cancelled{color:var(--bad);font-size:13px;font-weight:600}
/* espace client enrichi */
.cartbar{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.badge-n.info{background:var(--accent)}
.hello{padding:4px 0 16px}
.hello h2{font-size:26px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;cursor:pointer;min-width:0}
.qa:hover{border-color:var(--accent)}
.qa svg{width:24px;height:24px;color:var(--accent-2);margin-bottom:6px}
.qa b{font-family:var(--display);font-size:14px;line-height:1.2}
.qa span{font-size:12px;color:var(--muted)}
.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kpi-btn:hover{border-color:var(--accent)}
.svc-ph{position:relative}
.svc-tag{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px}
.price .from{display:block;font-family:var(--body);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.feat{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--muted)}
.feat li::before{content:"✓";color:var(--accent-2);margin-inline-end:8px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.acc summary{cursor:pointer;padding:13px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--accent-2);font-size:20px;line-height:1}
.acc[open] summary::after{content:"−"}
.acc p{margin:0;padding:0 14px 14px;color:var(--muted);font-size:14px}
.guide{margin:0;padding:0 14px 14px 34px;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.guide b{color:var(--fg)}
.guide li::marker{color:var(--accent-2);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--accent-2);text-decoration:none;font-weight:600}
.reply{margin-top:6px;font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.oprog.quote{color:var(--accent-2);font-size:13px;font-weight:600}
.todos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.todo{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;cursor:pointer;min-width:0}
.todo.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.todo-n{font-size:24px;font-weight:700;font-family:var(--display)}
.todo.on .todo-n{color:var(--accent-2)}
.todo-l{font-size:13px;font-weight:600;line-height:1.25}
.todo-s{font-size:11.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg-b{background:none;border:0;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg-b[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.badge-i{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}

/* produits NFC */
a.btn{text-decoration:none;color:var(--fg)}.req{color:var(--accent-2)}
.tab{font-size:11px;min-width:0}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.tchip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--accent-2);white-space:nowrap}
.tchip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.qbox{border:1px solid var(--accent);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.qbox summary{cursor:pointer;font-weight:700;list-style:none}.qbox summary::-webkit-details-marker{display:none}
.nfc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0;overflow:hidden}
.ncard-top{display:flex;gap:12px;align-items:center;min-width:0}.ncard-top .main{flex:1;min-width:0}
.ncard .t{font-weight:700;font-family:var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nlien{color:var(--accent-2)!important;text-decoration:none}
.nqr{width:64px;height:64px;border-radius:10px;background:#fff;padding:4px;flex:none;display:block}
.ncard .row .btn{flex:1 1 auto}
.nfc-sum{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;cursor:pointer;color:var(--fg);font:inherit}
.nfc-sum-l{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}.nfc-sum-l b{color:var(--fg)}
.nfc-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.nmini{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--fg);min-width:0}
.nmini span{font-size:20px}.nmini b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nmini small{color:var(--muted);font-size:12px}
.seg.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}.seg4 .seg-b{font-size:12.5px;padding:8px 2px}
.todos{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:620px){.todos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.success-box{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-radius:var(--r);padding:16px}
</style>
</head>
