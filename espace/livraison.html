<style>
  .lv-f{display:grid;gap:12px;max-width:520px}
  .lv-f label{display:block;font-size:12px;font-weight:700;color:var(--muted,#8a93a6);margin-bottom:5px}
  .lv-f input,.lv-f select{width:100%;padding:12px;border:1px solid var(--line,#2a2f3b);border-radius:11px;background:var(--surface,#171a22);color:inherit;font:inherit;font-size:15px}
  .lv-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lv-res{background:var(--surface,#171a22);border:1px solid var(--line,#2a2f3b);border-radius:16px;padding:16px;margin-top:14px;max-width:520px}
  .lv-res h3{margin:0 0 10px;font-size:16px}
  .lv-link{display:flex;gap:8px;align-items:center;background:var(--sunk,#1f232d);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
  .lv-link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace}
  .lv-link .btn{flex:0 0 auto}
  .lv-code{text-align:center;border:2px dashed var(--accent,#d62828);border-radius:14px;padding:12px;margin-bottom:12px}
  .lv-code b{font-size:30px;letter-spacing:6px;display:block}
</style>
