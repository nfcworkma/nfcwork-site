<style>
/* Cartes digitales, avis Google, Wi-Fi, pages liens : création au téléphone, sans Mac */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 10px;cursor:pointer;color:var(--fg);font:inherit;text-align:center}
.types button span{display:block;font-size:34px;line-height:1.1}
.types button b{display:block;margin-top:6px;font-size:16px}
.types button small{color:var(--muted);font-size:12.5px}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.prow .ph{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;font-size:22px}
.prow .ph img{width:100%;height:100%;object-fit:cover}
.prow .tx{flex:1;min-width:0}.prow .u{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipsf{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.linkbox{border-radius:16px;padding:16px;background:linear-gradient(120deg,#0b1a3a,#123a7a);border:1px solid var(--line);display:grid;gap:10px}
.linkbox code{display:block;font-size:16px;font-weight:700;color:#fff;word-break:break-all}
.linkbox .qr{width:110px;height:110px;background:#fff;border-radius:10px;padding:6px;flex:none}.linkbox .qr svg{width:100%;height:100%;display:block}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.themes2{display:flex;gap:8px;flex-wrap:wrap}
.themes2 button{border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13.5px}
.themes2 button[aria-pressed=true]{border-color:var(--accent)}
.photo{display:flex;align-items:center;gap:12px}
.photo .pv{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--bg);border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:28px}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.hgrid{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}
.hgrid input{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px;width:100%}
.lrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;align-items:center}
.lrow input{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14.5px;min-width:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.gal div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.gal img{width:100%;height:100%;object-fit:cover}.gal button{position:absolute;top:4px;right:4px;border:0;border-radius:8px;background:rgb(0 0 0/.6);color:#fff;width:26px;height:26px;cursor:pointer}
iframe.apercu{width:100%;height:72vh;border:0;border-radius:16px;background:#fff}
details.plus summary{cursor:pointer;font-weight:600;padding:4px 0}
</style>
</head>
