<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abonnements · nfcwork.ma</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05080f">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="outil.css">
<style>
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;color:var(--fg);font:inherit;cursor:pointer}
.stats button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.stats b{display:block;font-family:var(--display);font-size:22px}
.stats span{font-size:11.5px;color:var(--muted)}
.alist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.arow{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.arow.retard{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.arow.bientot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.arow .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.arow .h b{font-size:16px}
.arow .s{font-size:13px;color:var(--muted);margin-top:2px}
.arow .e{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin:10px 0}
.arow .e strong{font-family:var(--display);font-size:18px}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.hist{font-size:13px;color:var(--muted);display:grid;gap:4px;margin-top:8px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg4 button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer}
.seg4 button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="btn sm ghost" id="backBtn" href="./" aria-label="Retour">←</a>
  <div class="t"><b id="topTitle">Abonnements</b><small id="topSub">Paiements & activation</small></div>
  <button class="btn sm primary" id="nouveau">＋ Nouveau</button>
</div></header>
<main id="app"><div class="empty"><h3>Chargement…</h3></div></main>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="abonnements.js"></script>
</body>
</html>
