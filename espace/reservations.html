<link rel="stylesheet" href="outil.css">
<style>
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 6px;font:600 14px var(--body);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.kp div{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;text-align:center}.kp b{display:block;font-size:22px;line-height:1.2}.kp small{color:var(--muted);font-size:12px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.days::-webkit-scrollbar{display:none}
.days button{flex:none;min-width:54px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:6px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative}
.days button small{font-size:11px;color:var(--muted);text-transform:capitalize}.days button b{font-size:17px}
.days button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.days button[aria-pressed=true] small{color:#fff}
.days button i{position:absolute;top:3px;right:5px;font-style:normal;font-size:10px;font-weight:700;background:var(--warn);color:#111;border-radius:9px;padding:0 5px}
.sh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.rv{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.rv .h{font-size:18px;font-weight:700;min-width:52px}.rv .h small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.rv .q{flex:1;min-width:0}.rv .q b{display:block;line-height:1.3;word-break:break-word}.rv .q small{color:var(--muted);font-size:12.5px}
.rv .a{display:flex;gap:6px;align-items:center;flex:none}
.ic{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);display:grid;place-items:center;font-size:17px;cursor:pointer;text-decoration:none;padding:0}
.ic.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ic.no{color:var(--bad)}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;border:0;cursor:default}
.tag.c{background:var(--ok-soft);color:#4ade80}.tag.v{background:var(--accent-soft);color:var(--accent-2)}.tag.r{background:var(--bad-soft);color:var(--bad)}
button.tag.arr{background:var(--warn-soft);color:var(--warn);cursor:pointer;font:700 12px var(--body)}
.pg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:13px}.bar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar div{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}.bar div i{display:block;height:100%;background:var(--accent);border-radius:6px}.bar b{text-align:right}
.fc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;margin-bottom:8px}.fc .q{flex:1;min-width:0}.fc .q small{color:var(--muted);font-size:12.5px}
.lnk{font:600 13px ui-monospace,Menlo,monospace;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;margin:8px 0}
</style>
</head>

  <button class="btn sm" id="rappels" hidden>🔔 Rappels</button>
</div></header>
