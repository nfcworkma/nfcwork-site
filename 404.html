<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · nfcwork.ma</title>
<meta name="robots" content="noindex">
<script>
  // nfcwork.ma/menu/<nom> → page du menu digital ; nfcwork.ma/q/<CODE> → stand QR
  (function () {
    var m = location.pathname.match(/^\/menu\/([a-z0-9-]+)\/?$/i);
    if (m) location.replace("/menu/?m=" + m[1].toLowerCase() + (location.search ? "&" + location.search.slice(1) : "") + location.hash);
    // nfcwork.ma/p/<nom> → carte digitale, avis Google, Wi-Fi ou page liens créés dans l'Espace
    var pg = location.pathname.match(/^\/p\/([a-z0-9-]+)\/?$/i);
    if (pg) location.replace("/p/?s=" + pg[1].toLowerCase());
    // nfcwork.ma/tv/<nom> → vidéo du menu sur écran TV (en boucle)
    var tv = location.pathname.match(/^\/tv\/([a-z0-9-]+)\/?$/i);
    if (tv) location.replace("/tv/?v=" + tv[1].toLowerCase());
    // nfcwork.ma/q/<CODE> → stand QR (lien modifiable depuis l'Espace)
    var q = location.pathname.match(/^\/q\/([A-Za-z0-9]+)\/?$/);
    if (q) location.replace("/q/?c=" + q[1].toUpperCase());
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05080f;color:#e9effa;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:26px;margin:0 0 8px}
  p{color:#93a3be;margin:0 0 20px}
  a{display:inline-block;padding:12px 20px;border-radius:12px;background:#1e90ff;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div>
    <h1>Page introuvable</h1>
    <p>Le lien est peut-être incorrect.</p>
    <a href="/">Retour à nfcwork.ma</a>
  </div>
</body>
</html>
