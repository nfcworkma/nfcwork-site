<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFCWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05080f">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<style>
  :root{--bg:#05080f;--surface:#0b1220;--fg:#e9effa;--muted:#93a3be;--line:#1d2b45;--accent:#1e90ff;--accent-2:#3fd0ff;--ok:#25d366;color-scheme:dark}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Readex Pro",system-ui,-apple-system,sans-serif}
  body{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));
    background:radial-gradient(60vmax 40vmax at 85% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),var(--bg)}
  main{width:100%;max-width:420px;text-align:center}
  .logo{width:220px;max-width:70%;height:auto;margin:0 auto 26px;display:block}
  h1{font-size:24px;margin:0 0 8px;line-height:1.25}
  p{color:var(--muted);margin:0 0 22px;line-height:1.5}
  .code{display:inline-block;font-weight:700;letter-spacing:.12em;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--accent-2);margin-bottom:18px}
  .btns{display:grid;gap:10px}
  a.btn,button.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.wa{background:var(--ok);border-color:var(--ok);color:#06301a}
  .admin{margin-top:26px;padding:16px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--accent-2) 50%,var(--line));text-align:start}
  .admin b{display:block;margin-bottom:6px}
  .admin small{display:block;color:var(--muted);word-break:break-all;margin-bottom:12px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:30px auto 0}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/img/logo-nfcwork-blanc.png" alt="NFCWORK" width="1332" height="268">
  <div id="wait"><div class="spin" aria-label="Chargement"></div></div>
  <section id="free" hidden>
    <span class="code" id="codeA"></span>
    <h1>Stand NFCWORK</h1>
    <p>Ce stand sera bientôt actif. Découvrez nos cartes, plaques et menus NFC.</p>
    <div class="btns">
      <a class="btn primary" href="/">Découvrir nfcwork.ma</a>
      <a class="btn wa" href="https://wa.me/212620666027" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </section>
  <section id="admin" class="admin" hidden>
    <b>Espace admin · stand <span id="codeB"></span></b>
    <small id="target"></small>
    <div class="btns">
      <a class="btn primary" id="lier" href="#">Lier ce stand</a>
      <a class="btn" id="ouvrir" href="#" hidden>Ouvrir le lien</a>
    </div>
  </section>
</main>
<script>
/* NFCWORK — stand QR : nfcwork.ma/q/<CODE> (404.html renvoie ici avec ?c=<CODE>)
   Le lien du stand est dans Firestore « settings/qr-<CODE> » (lecture publique), modifiable depuis Espace → Stands QR.
   Sur le téléphone de l'admin (connecté une fois à l'Espace), on n'ouvre pas tout de suite : on propose de lier / modifier. */
(function () {
  "use strict";
  var DOC = "https://firestore.googleapis.com/v1/projects/nfcwork-espace/databases/(default)/documents/settings/qr-";
  var qs = new URLSearchParams(location.search), m = location.pathname.match(/^\/q\/([A-Za-z0-9]+)\/?$/);
  var code = String(qs.get("c") || (m && m[1]) || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  var admin = false;
  try { admin = localStorage.getItem("nfcwork-admin") === "1"; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var ok = function (u) { return /^https?:\/\//i.test(u || ""); };

  function libre() {
    $("wait").hidden = true; $("free").hidden = false; $("codeA").textContent = code || "—";
    if (admin && code) montrerAdmin("");
  }
  function montrerAdmin(url) {
    $("wait").hidden = true; $("admin").hidden = false; $("codeB").textContent = code;
    $("target").textContent = url ? "Ouvre : " + url : "Ce stand n'est lié à rien pour l'instant.";
    $("lier").textContent = url ? "Modifier ce stand" : "Lier ce stand";
    $("lier").href = "/espace/stands.html#lier=" + code;
    if (url) { $("ouvrir").hidden = false; $("ouvrir").href = url; }
  }
  function aller(url) {
    if (admin) { montrerAdmin(url); return; }
    location.replace(url);
  }
  if (!code) { libre(); return; }
  var cle = "nfcwork-qr-" + code, memo = "";
  try { memo = localStorage.getItem(cle) || ""; } catch (e) {}
  fetch(DOC + code, { cache: "no-store" }).then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("http");
    return r.json();
  }).then(function (j) {
    var url = j && j.fields && j.fields.url && j.fields.url.stringValue;
    if (ok(url)) { try { localStorage.setItem(cle, url); } catch (e) {} aller(url); }
    else { try { localStorage.removeItem(cle); } catch (e) {} libre(); }
  }).catch(function () { if (ok(memo)) aller(memo); else libre(); });
})();
</script>
</body>
</html>
