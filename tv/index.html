<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu TV · NFCWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png">
<style>
/* VIDÉO SUR ÉCRAN TV : plein écran, en boucle, sans son, sans arrêt
   Lien : nfcwork.ma/tv/<nom>  (404.html renvoie ici avec ?v=<nom>) → vidéo tv/v/<nom>.mp4 */
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:#9aa;font:600 2.2vw system-ui,sans-serif;text-align:center;padding:4vw}
#msg b{display:block;color:#fff;font-size:3vw;margin-bottom:1vw}
#fs{position:fixed;z-index:5;top:2vh;right:2vw;border:0;border-radius:10px;padding:10px 16px;background:rgba(255,255,255,.14);color:#fff;font:600 15px system-ui,sans-serif;opacity:0;transition:opacity .3s;cursor:pointer}
body.souris{cursor:default}body.souris #fs{opacity:1}
</style>
</head>
<body>
<video id="v" muted playsinline autoplay loop preload="auto" disablepictureinpicture></video>
<div id="msg"><div><b>Menu TV</b>Chargement de la vidéo…</div></div>
<button id="fs" type="button">Plein écran</button>
<script>
(function () {
  "use strict";
  const qs = new URLSearchParams(location.search);
  const nom = String(qs.get("v") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  const v = document.getElementById("v"), msg = document.getElementById("msg");
  const dire = (t, s) => { msg.hidden = false; msg.innerHTML = `<div><b>${t}</b>${s || ""}</div>`; };
  if (!nom) { dire("Menu TV", "Ajoutez le nom de la vidéo au lien : nfcwork.ma/tv/nom"); return; }
  /* ===== Mode 1 : pages du menu (PDF importé dans l'Espace → Menus TV), en boucle avec transitions ===== */
  const DOC = "https://firestore.googleapis.com/v1/projects/nfcwork-espace/databases/(default)/documents/settings/";
  const CLE = "nfcwork-tv-" + nom;
  async function lireDoc(id) {
    const r = await fetch(DOC + id, { cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("http " + r.status);
    return (await r.json()).fields || {};
  }
  async function lireEcran() {
    try { const f = await lireDoc("tv-" + nom); if (!f) return { E: null, ok: true }; const j = (f.json && f.json.stringValue) || ""; try { localStorage.setItem(CLE, j); } catch (e) {} return { E: JSON.parse(j || "null"), ok: true }; }
    catch (e) { try { return { E: JSON.parse(localStorage.getItem(CLE) || "null"), ok: false }; } catch (x) { return { E: null, ok: false }; } }
  }
  // chaque page est gardée sur l'appareil : le défilement continue sans Internet
  async function pageImg(id) {
    const k = "/__tv-img/" + id; let box = null;
    try { box = await caches.open("nfcwork-tv"); const hit = await box.match(k); if (hit) return await hit.text(); } catch (e) {}
    const f = await lireDoc("mimg-" + id).catch(() => null);
    const d = f && f.data && f.data.stringValue;
    if (!d || !d.startsWith("data:image/")) return "";
    try { if (box) await box.put(k, new Response(d)); } catch (e) {}
    return d;
  }
  function diapo(E) {
    v.remove(); msg.hidden = true;
    document.title = (E.nom || "Menu") + " · Menu TV";
    const st = document.createElement("style");
    st.textContent = `.dp{position:fixed;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s ease}.dp.on{opacity:1}
      .dp .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(40px) brightness(.45);transform:scale(1.1)}
      .dp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
      .noir .dp .bg{display:none}
      .zoom .dp.on img{animation:zm var(--d) linear forwards}@keyframes zm{from{transform:scale(1)}to{transform:scale(1.06)}}
      .glisse .dp{transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);transform:translateX(6%)}.glisse .dp.on{transform:none}.glisse .dp.out{transform:translateX(-6%)}`;
    document.head.appendChild(st);
    let pages = [], i = -1, cur = null, minuteur = 0;
    const appliquer = e => {
      document.documentElement.className = (e.effet || "zoom") + " " + (e.fond === "noir" ? "noir" : "flou");
      document.documentElement.style.setProperty("--d", Math.max(4, +e.duree || 8) + "s");
    };
    appliquer(E);
    async function preparer(e) {
      const ids = (e.pages || []).slice(0, 40), out = [];
      for (const id of ids) { const d = await pageImg(id); if (d) out.push(d); }
      return out;
    }
    function suivante() {
      if (!pages.length) return;
      i = (i + 1) % pages.length;
      const d = document.createElement("div"); d.className = "dp";
      d.innerHTML = `<div class="bg" style="background-image:url('${pages[i]}')"></div><img src="${pages[i]}" alt="">`;
      document.body.appendChild(d);
      requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("on")));
      const old = cur; cur = d;
      if (old) { old.classList.remove("on"); old.classList.add("out"); setTimeout(() => old.remove(), 1500); }
      clearTimeout(minuteur);
      minuteur = setTimeout(suivante, pages.length > 1 ? Math.max(4, +E.duree || 8) * 1000 : 60000);
    }
    // plein écran (toucher l'écran ou bouton), écran toujours allumé
    const plein = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); eveil(); };
    async function eveil() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
    document.getElementById("fs").onclick = plein;
    document.body.addEventListener("click", e => { if (!e.target.closest("#fs")) plein(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) eveil(); });
    eveil();
    let t = 0;
    document.addEventListener("mousemove", () => { document.body.classList.add("souris"); clearTimeout(t); t = setTimeout(() => document.body.classList.remove("souris"), 2500); });
    preparer(E).then(p => { pages = p; if (!pages.length) dire(E.nom || "Menu TV", "Aucune page pour l’instant."); else suivante(); });
    // les changements faits dans l'Espace arrivent tout seuls (toutes les 3 minutes)
    setInterval(async () => {
      const r = await lireEcran(); if (!r.ok || !r.E) return;
      if (JSON.stringify(r.E) === JSON.stringify(E)) return;
      if (r.E.actif === false) { location.reload(); return; }
      E = r.E; appliquer(E);
      const p = await preparer(E); if (p.length) { pages = p; i = -1; suivante(); }
    }, 3 * 60 * 1000);
  }

  /* ===== Mode 2 : vidéo montée (fichier tv/v/<nom>.mp4), en boucle ===== */
  function video() {
    // MP4 (H.264) pour presque toutes les TV ; WebM en secours si le navigateur ne lit pas le MP4
    const mp4 = !!v.canPlayType('video/mp4; codecs="avc1.640028"');
    let src = "/tv/v/" + nom + (mp4 ? ".mp4" : ".webm");
    v.poster = "/tv/v/" + nom + ".jpg";
    document.title = nom.charAt(0).toUpperCase() + nom.slice(1) + " · Menu TV";

    // La vidéo est gardée sur l'appareil : elle continue de tourner même si Internet coupe.
    const BOITE = "nfcwork-tv";
    let urlLocale = "";
    async function charger(force) {
      let rep = null, box = null;
      try { box = await caches.open(BOITE); if (!force) rep = await box.match(src); } catch (e) {}
      if (!rep) {
        try {
          const r = await fetch(src + "?t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error("http " + r.status);
          if (box) { try { await box.put(src, r.clone()); } catch (e) {} }
          rep = r;
        } catch (e) {
          if (box) rep = await box.match(src).catch(() => null);
        }
      }
      if (!rep && !src.endsWith(".mp4")) { src = "/tv/v/" + nom + ".mp4"; return charger(force); }   // pas de WebM : on tente le MP4
      if (!rep) return false;
      const blob = await rep.blob();
      if (!blob.size) return false;
      const ancien = urlLocale;
      urlLocale = URL.createObjectURL(blob);
      v.src = urlLocale;
      if (ancien) setTimeout(() => URL.revokeObjectURL(ancien), 5000);
      return true;
    }
    function jouer() { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    v.addEventListener("playing", () => { msg.hidden = true; });
    v.addEventListener("ended", () => { v.currentTime = 0; jouer(); });   // au cas où « loop » est ignoré par la TV
    v.addEventListener("error", () => { setTimeout(() => charger(false).then(jouer), 3000); });

    // Surveillance : si l'image se fige, on relance
    let derniere = -1, figee = 0;
    setInterval(() => {
      if (v.readyState >= 2 && !v.paused && v.currentTime === derniere) figee++; else figee = 0;
      derniere = v.currentTime;
      if (v.paused || figee >= 3) { figee = 0; jouer(); if (v.readyState < 2) charger(false).then(jouer); }
    }, 5000);

    // Chaque nuit (vers 4 h) : on récupère la dernière version de la vidéo
    setInterval(() => { const h = new Date().getHours(); if (h === 4 && navigator.onLine) charger(true).then(jouer); }, 60 * 60 * 1000);

    // Écran toujours allumé (si la TV le permet)
    async function eveil() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { eveil(); jouer(); } });
    eveil();

    // Plein écran : bouton visible quand on bouge la souris, ou toucher l'écran
    const plein = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); eveil(); jouer(); };
    document.getElementById("fs").onclick = plein;
    v.addEventListener("click", plein);
    let t = 0;
    document.addEventListener("mousemove", () => { document.body.classList.add("souris"); clearTimeout(t); t = setTimeout(() => document.body.classList.remove("souris"), 2500); });

    charger(false).then(ok => { if (ok) jouer(); else dire("Vidéo introuvable", "Vérifiez le lien : nfcwork.ma/tv/" + nom); });
  }

  lireEcran().then(r => {
    if (r.E && r.E.actif === false) { dire(r.E.nom || "Menu TV", "Écran momentanément indisponible."); return; }
    if (r.E && (r.E.pages || []).length) diapo(r.E); else video();
  });
})();
</script>
</body>
</html>
