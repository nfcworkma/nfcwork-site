<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-title="nav_order" data-seo>Commander · NFCWORK</title>
  <meta name="description" content="Commandez vos produits NFCWORK en ligne : cartes NFC, plaques avis Google, menus digitaux. Paiement à la livraison partout au Maroc.">
  <link rel="canonical" href="https://nfcwork.ma/commande.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NFCWORK">
  <meta property="og:title" content="Commander · NFCWORK">
  <meta property="og:description" content="Commandez vos produits NFCWORK en ligne : cartes NFC, plaques avis Google, menus digitaux. Paiement à la livraison partout au Maroc.">
  <meta property="og:url" content="https://nfcwork.ma/commande.html">
  <meta property="og:image" content="https://nfcwork.ma/assets/img/packs.jpg">
  <meta property="og:locale" content="fr_MA">
  <meta name="theme-color" content="#05080f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/icons/favicon-48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="order">
  <header id="site-header"></header>

  <main>
    <section class="wrap page-head">
      <h1 data-t="orderH"></h1>
      <p data-t="orderP"></p>
    </section>

    <section class="wrap">
      <div class="two">
        <!-- PANIER -->
        <div class="box">
          <h2 data-t="yourCart"></h2>
          <div id="lines"></div>
          <div class="tot" id="tot"></div>
        </div>

        <!-- FORMULAIRE -->
        <div class="box">
          <h2 data-t="yourInfo"></h2>
          <form id="orderForm" novalidate>
            <label for="f-name"><span data-t="fName"></span><input id="f-name" autocomplete="name"><span class="err" id="e-f-name"></span></label>
            <label for="f-phone"><span data-t="fPhone"></span><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06XXXXXXXX" dir="ltr"><span class="err" id="e-f-phone"></span></label>
            <label for="f-city"><span data-t="fCity"></span><select id="f-city"></select><span class="err" id="e-f-city"></span></label>
            <label for="f-other" id="otherWrap" hidden><span data-t="fOther"></span><input id="f-other"></label>
            <label for="f-addr"><span data-t="fAddr"></span><input id="f-addr" autocomplete="street-address"></label>
            <label for="f-biz"><span data-t="fBiz"></span><input id="f-biz" autocomplete="organization"></label>
            <fieldset id="cardBox" hidden>
              <legend data-t="cardH"></legend>
              <p class="note" data-t="cardP"></p>
              <div class="grid2">
                <label for="cd-nom"><span data-t="cdNom"></span><input id="cd-nom" autocomplete="name"></label>
                <label for="cd-job"><span data-t="cdJob"></span><input id="cd-job" autocomplete="organization-title"></label>
                <label for="cd-instagram"><span>Instagram</span><input id="cd-instagram" placeholder="@…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-facebook"><span>Facebook</span><input id="cd-facebook" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-linkedin"><span>LinkedIn</span><input id="cd-linkedin" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-tiktok"><span>TikTok</span><input id="cd-tiktok" placeholder="@…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-snapchat"><span>Snapchat</span><input id="cd-snapchat" placeholder="@…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-youtube"><span>YouTube</span><input id="cd-youtube" placeholder="@…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-site"><span data-t="cdSite"></span><input id="cd-site" type="url" inputmode="url" placeholder="exemple.ma" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="cd-maps"><span data-t="cdMaps"></span><input id="cd-maps" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
              </div>
            </fieldset>
            <fieldset id="keyBox" hidden>
              <legend data-t="kH"></legend>
              <p class="note" data-t="kP"></p>
              <div class="grid2">
                <label for="k-ssid" data-k="wifi"><span data-t="kSsid"></span><input id="k-ssid" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="k-pass" data-k="wifi"><span data-t="kPass"></span><input id="k-pass" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
                <label for="k-google" data-k="google"><span data-t="kGoogle"></span><input id="k-google" type="url" inputmode="url" placeholder="https://g.page/…" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"></label>
              </div>
              <label for="k-wifi-qr" data-k="wifi" class="upl"><span data-t="kWifiQr"></span><input id="k-wifi-qr" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"><small class="note" data-t="kWifiQrHint"></small><span class="upl-st" id="st-k-wifi-qr" role="status"></span><small class="note" id="qr-k-wifi-qr" role="status"></small><span class="err" id="e-k-wifi-qr"></span></label>
              <label for="k-logo" class="upl"><span data-t="kLogo"></span><input id="k-logo" type="file" accept=".png,.jpg,.jpeg,.webp,.svg,image/png,image/jpeg,image/webp,image/svg+xml"><small class="note" data-t="kImgHint"></small><span class="upl-st" id="st-k-logo" role="status"></span><span class="err" id="e-k-logo"></span></label>
            </fieldset>
            <label class="check" for="f-design"><input type="checkbox" id="f-design"><span data-t="fDesign"></span></label>
            <label for="f-note"><span data-t="fNote"></span><textarea id="f-note"></textarea></label>
            <a class="btn wa block" id="send" href="#" target="_blank" rel="noopener" data-t="send"></a>
            <p class="note" data-t="sendNote"></p>
            <div class="copyrow"><span data-t="fallback"></span><code dir="ltr" class="phone-num"></code><button type="button" id="copyOrder" data-t="copy"></button></div>
          </form>
          <div class="success" id="done" hidden>
            <h3 data-t="doneH"></h3>
            <p class="note" data-t="doneP"></p>
            <code id="doneRef" dir="ltr"></code>
            <button type="button" class="btn" id="newOrder" data-t="newOrder"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/contenu.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
