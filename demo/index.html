<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Démos NFCWORK</title>
<meta name="description" content="Exemples NFCWORK par métier : restaurant, location de voitures, salon, hôtel, boutique, médecin, avis Google, Wi-Fi.">
<meta name="theme-color" content="#05080f">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#05080f;--surf:#0b1220;--line:#1b2a44;--fg:#e8eefa;--muted:#8fa3c7;--accent:#2f7bff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Readex Pro",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:26px;width:auto}.lg-print{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);color:var(--fg);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
h1{font-size:clamp(26px,5vw,40px);margin:26px 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;font-size:16px;line-height:1.6;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--surf);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:30px;line-height:1}
.card b{font-size:17px}.card small{color:var(--muted);font-size:13.5px;line-height:1.5}
.card .qr{display:none}
.card .go{margin-top:auto;color:var(--accent);font-weight:600;font-size:14px}
.note{margin-top:22px;color:var(--muted);font-size:13.5px}
/* feuille à imprimer : une page A4 avec un QR par métier */
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff;color:#111}
  .top .btn,.note,.card .go,.lg-ecran{display:none}.lg-print{display:block;height:9mm!important}
  .wrap{padding:0;max-width:none}
  h1{color:#111;margin:3mm 0 1mm;font-size:19pt}.lead{color:#444;margin:0 0 5mm;font-size:10.5pt}
  .grid{grid-template-columns:repeat(4,1fr);gap:3mm}
  .card{background:#fff;border:.3mm solid #ccc;border-radius:4mm;padding:3mm;break-inside:avoid;align-items:center;text-align:center;gap:1mm}
  .card small{color:#555;font-size:8pt;line-height:1.3}.card b{font-size:11.5pt}.card .ic{font-size:16pt}
  .card .qr{display:block;width:29mm;height:29mm;margin-top:1mm}.card .qr svg{width:100%;height:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/"><img class="lg-ecran" src="/assets/img/logo-nfcwork-blanc.png" alt="NFCWORK"><img class="lg-print" src="/assets/img/logo-nfcwork.png" alt="NFCWORK"></a>
    <button class="btn pri" onclick="print()">🖨 Imprimer la feuille démo</button></div>
  <h1>Voyez l’exemple de votre métier</h1>
  <p class="lead">Touchez votre métier, ou scannez son QR : vous voyez tout de suite ce que vos clients verront sur leur téléphone. NFCWORK le prépare ensuite avec votre logo, vos produits et vos prix.</p>
  <div class="grid" id="g"></div>
  <p class="note">Ces pages sont des exemples : noms, numéros et prix sont fictifs.</p>
</div>
<script src="/assets/js/qrgen.js"></script>
<script>
const D=[
 ["🍽","Restaurant & café","Menu avec photos, commande WhatsApp, livraison, réservation","/menu/demo-premium"],
 ["🚗","Location de voitures","Voitures, prix par jour, réservation avec dates et heures","/menu/demo-location"],
 ["💈","Salon & barber","Services et prix, rendez-vous sur WhatsApp","/menu/demo-salon"],
 ["🏨","Hôtel & riad","Room service depuis la chambre (ici chambre 12)","/menu/demo-hotel?table=12"],
 ["🛍","Boutique & pâtisserie","Catalogue, commande et livraison sur WhatsApp","/menu/demo-boutique"],
 ["📺","Menu sur écran TV","Le menu défile tout seul sur la TV du commerce","/menu/tv/?m=demo-premium"],
 ["🩺","Médecin & carte pro","Carte NFC : contact, horaires, WhatsApp, enregistrer le numéro","/p/demo-medecin"],
 ["⭐","Avis Google","Le client arrive direct sur la page pour laisser 5 étoiles","/p/demo-avis"],
 ["📶","Wi-Fi","Connexion au Wi-Fi sans demander le mot de passe","/p/demo-wifi"],
 ["🔗","Page liens Instagram","Tous les liens du commerce sur une seule page","/p/demo-liens"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("g").innerHTML=D.map(([i,n,s,u])=>{let q="";try{q=QRGEN.svg("https://nfcwork.ma"+u,{marge:0,couleur:"#111111"})}catch(e){}
 return `<a class="card" href="${esc(u)}"><span class="ic">${i}</span><b>${esc(n)}</b><small>${esc(s)}</small><span class="qr">${q}</span><span class="go">Voir l’exemple →</span></a>`}).join("");
</script>
</body>
</html>
