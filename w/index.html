<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&/nfcwork\.ma$/.test(location.hostname))location.replace("https:"+location.href.slice(5))</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiffy · Carte de fidélité</title>
<meta name="description" content="Votre carte de fidélité Kiffy, dans Apple Wallet et Google Wallet.">
<meta name="theme-color" content="#16C172">
<link rel="icon" type="image/png" sizes="192x192" href="/kiffy/icones/kiffy-192.png">
<link rel="apple-touch-icon" href="/kiffy/icones/kiffy-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root { --vert: #16C172; --noir: #0A0A0A; --fond: #F4F7F5; --gris: #5B665F; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--noir); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.haut { background: var(--couleur, var(--vert)); padding: max(48px, env(safe-area-inset-top)) 24px 40px; text-align: center; position: relative; overflow: hidden; color: var(--encre, var(--noir)); }
.haut svg.ronds { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
.logo { position: relative; width: 88px; height: 88px; margin: 0 auto; border-radius: 24px; background: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; color: var(--noir); overflow: hidden; box-shadow: 0 10px 26px rgba(10,10,10,.15); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.nom { position: relative; font-size: 26px; font-weight: 800; margin-top: 16px; }
.slogan { position: relative; font-size: 15px; font-weight: 600; margin-top: 4px; opacity: .85; }
.kiffy { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.vague { display: block; width: 100%; height: 26px; margin-top: -1px; }
.corps { padding: 18px 24px 28px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.cadeau { display: flex; align-items: center; gap: 12px; background: var(--fond); border-radius: 18px; padding: 14px 16px; }
.cadeau b { display: block; font-size: 16px; }
.cadeau span { font-size: 13.5px; color: var(--gris); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--noir); color: #fff; border-radius: 20px; padding: 19px; font-size: 18px; font-weight: 800; text-decoration: none; text-align: center; }
.wallets { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--gris); }
.wallets span { display: inline-flex; align-items: center; gap: 6px; }
.wallets img { height: 22px; width: auto; }
.pied { text-align: center; font-size: 12px; color: #8A938E; margin-top: auto; padding-top: 10px; }
.pied b { color: var(--noir); }
.etat { text-align: center; font-size: 15px; color: var(--gris); line-height: 1.5; }
.etat h1 { font-size: 22px; color: var(--noir); margin: 4px 0 6px; }
.code { display: inline-block; font-weight: 800; letter-spacing: 1px; background: var(--fond); border-radius: 10px; padding: 4px 10px; color: var(--noir); }
.chargement .kiffy { font-size: 64px; color: var(--noir); animation: p 1.2s ease-in-out infinite; }
@keyframes p { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main id="m"><div class="haut chargement" style="flex:1;display:flex;align-items:center;justify-content:center"><span class="kiffy">kiffy</span></div></main>
<script>
/* Plaque Kiffy à code unique : nfcwork.ma/w/?c=KF-A7K2 (QR et puce NFC de la plaque).
   Plaque liée à un commerce → page du commerce + gros bouton vers sa carte (/f/…) ; sinon « pas encore activée ».
   Pas de redirection automatique (règle NFC Work) : le client touche le bouton. */
(function () {
  "use strict";
  var PROJET = "nfcwork-espace", CLE = "AIzaSyDFJGerneuM-Og0Hs9IKIcFqVbLlS9Yqjc";   // clé web publique (la même que le site)
  var EMU = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]emu\b/.test(location.search);   // tests locaux (émulateur, projet demo-kiffy)
  var FS = EMU ? "http://127.0.0.1:8080/v1/projects/demo-kiffy/databases/(default)/documents/" : "https://firestore.googleapis.com/v1/projects/" + PROJET + "/databases/(default)/documents/";
  var m = document.getElementById("m");
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var VAGUE = function (c) { return '<svg class="vague" viewBox="0 0 560 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h560v8c-70 18-140 18-210 6s-140-14-210 2S70 30 0 12z" fill="' + c + '"/></svg>'; };
  var RONDS = '<svg class="ronds" width="390" height="300" viewBox="0 0 390 300" aria-hidden="true"><g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"><circle cx="40" cy="60" r="70"/><circle cx="40" cy="60" r="120"/><circle cx="360" cy="260" r="60"/><circle cx="360" cy="260" r="110"/></g></svg>';
  var CADEAU = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16C172" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M2 9h20M12 9v12M12 9c-2-4-7-4-6-1s6 1 6 1c2-4 7-4 6-1s-6 1-6 1"/></svg>';
  var WALLETS = '<div class="wallets"><span><img src="/assets/wallet/apple-wallet-icon.png" alt="">Apple Wallet</span><span><img src="/assets/wallet/google-wallet-icon.svg" alt="">Google Wallet</span></div>';
  var PIED = '<div class="pied">Propulsé par <b>NFC WORK</b> · nfcwork.ma</div>';
  // valeurs Firestore REST → objet simple
  function val(v) { if (!v) return null; if ("stringValue" in v) return v.stringValue; if ("integerValue" in v) return +v.integerValue; if ("doubleValue" in v) return v.doubleValue; if ("booleanValue" in v) return v.booleanValue; if ("nullValue" in v) return null; return null; }
  function lire(chemin) { return fetch(FS + chemin + "?key=" + CLE).then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error("http " + r.status); return r.json(); }).then(function (d) { if (!d) return null; var o = {}; for (var k in d.fields || {}) o[k] = val(d.fields[k]); return o; }); }
  function clair(hex) { var h = String(hex || "#16C172").replace("#", ""); return 0.299 * parseInt(h.slice(0, 2), 16) + 0.587 * parseInt(h.slice(2, 4), 16) + 0.114 * parseInt(h.slice(4, 6), 16) > 170; }
  function etat(titre, texte) {
    m.innerHTML = '<div class="haut">' + RONDS + '<div class="kiffy" style="position:relative;font-size:72px">kiffy</div><div class="slogan">Approchez. Cumulez. Gagnez.</div></div>' + VAGUE("#16C172") +
      '<div class="corps"><div class="etat"><h1>' + esc(titre) + '</h1>' + texte + '</div>' + WALLETS + PIED + '</div>';
  }
  var code = String(new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  if (!/^KF-[A-Z0-9]{4,8}$/.test(code)) { etat("Plaque Kiffy", "Scannez le QR ou approchez votre téléphone d’une plaque Kiffy pour obtenir votre carte de fidélité."); return; }
  lire("fidPlaques/" + encodeURIComponent(code)).then(function (pl) {
    if (!pl) { etat("Plaque inconnue", 'Le code <span class="code">' + esc(code) + '</span> n’existe pas. Vérifiez le QR de la plaque, ou demandez au commerçant.'); return; }
    if (!pl.pid) { etat("Plaque Kiffy pas encore activée", 'Cette plaque <span class="code">' + esc(code) + '</span> n’est pas encore liée à un commerce. Revenez bientôt : vos points vous attendent !'); return; }
    return lire("fidProgrammes/" + encodeURIComponent(pl.pid)).then(function (p) {
      if (!p) { etat("Plaque Kiffy pas encore activée", 'Cette plaque <span class="code">' + esc(code) + '</span> n’est liée à aucun commerce actif.'); return; }
      if (p.actif === false) { etat(p.nom || "Carte de fidélité", "La carte de fidélité de ce commerce est momentanément indisponible. Réessayez plus tard."); return; }
      var col = /^#[0-9a-f]{6}$/i.test(p.couleur || "") ? p.couleur : "#16C172", encre = clair(col) ? "#0A0A0A" : "#FFFFFF";
      var deja = null; try { deja = localStorage.getItem("nfcwork-fid-" + pl.pid); } catch (e) {}
      var lien = deja ? "/f/?c=" + encodeURIComponent(deja) : "/f/" + encodeURIComponent(p.court || pl.pid);
      var logo = /^data:image\/(png|jpeg|webp);base64,/.test(p.logoData || "") ? '<img src="' + p.logoData + '" alt="">' : esc((String(p.nom || "?").trim()[0] || "?").toUpperCase());
      var obj = parseInt(p.objectif, 10) || 10, unite = p.unite || (p.type === "montant" ? "points" : "visites");
      document.title = (p.nom || "Carte de fidélité") + " · Kiffy";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", col);
      m.style.setProperty("--couleur", col); m.style.setProperty("--encre", encre);
      m.innerHTML = '<div class="haut">' + RONDS + '<div class="logo">' + logo + '</div><div class="nom">' + esc(p.nom || "") + '</div><div class="slogan">Votre carte de fidélité · <span class="kiffy" style="letter-spacing:-.5px">kiffy</span></div></div>' + VAGUE(col) +
        '<div class="corps">' +
        (p.recompense ? '<div class="cadeau">' + CADEAU + '<div><b>' + esc(p.recompense) + '</b><span>après ' + obj + ' ' + esc(unite) + '</span></div></div>' : "") +
        '<a class="btn" href="' + lien + '">' + (deja ? "Ouvrir ma carte" : "Obtenir ma carte de fidélité") + '</a>' +
        '<div class="etat" style="font-size:13.5px">' + (deja ? "Vos points vous attendent." : "Gratuit, en 10 secondes. Elle s’ajoute dans votre téléphone.") + '</div>' + WALLETS + PIED + '</div>';
    });
  }).catch(function () { etat("Connexion impossible", "Vérifiez internet puis réessayez."); });
})();
</script>
</body>
</html>
